# ECS Fargate + ALB + ECR + RDS PostgreSQL/pgvector, with autoscaling (§2.6).
#
# One command recreates all of it from nothing:
#   bash infra/deploy.sh
#
# Shape follows Session 4's demoed architecture deliberately (§7 says reuse it,
# don't reinvent): ECR repo, ECS cluster/service/task-def, ALB with an ip-type
# target group, and security groups where only the ALB reaches the task.
#
# Networking note: this uses the DEFAULT VPC's subnets rather than creating a
# VPC. A teaching deployment that stands up for a recording and is torn down the
# same day does not need its own three-tier network, and a NAT gateway alone
# would cost more than everything else here combined. The task runs in a public
# subnet with a public IP so it can reach the LLM API and ECR; it is still
# unreachable from the internet because its security group only admits the ALB.
# RDS is not publicly accessible and only admits the task's security group.

AWSTemplateFormatVersion: "2010-09-09"
Description: eCom order-support agent - ECS Fargate + ALB + RDS pgvector (Assignment 2)

Parameters:
  ProjectName:
    Type: String
    Default: ecom-agent
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets in different AZs (ALB requires this)
  ImageUri:
    Type: String
    Description: ECR image URI tagged by commit SHA
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password (generated by deploy.sh, never committed)
  LLMProvider:
    Type: String
    Default: glm
    AllowedValues: [glm, groq, anthropic]
  ZaiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: Required - embeddings for pgvector retrieval
  DesiredCount:
    Type: Number
    Default: 1
  MinTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 4
  CpuTargetPercent:
    Type: Number
    Default: 50

Resources:
  # The ECR repository is deliberately NOT declared here.
  #
  # It cannot be: the image has to exist in the registry before this stack can
  # create a service that runs it, so the repo is created and pushed to by
  # infra/deploy.sh (and by the GitHub Actions deploy job) BEFORE the stack is
  # deployed. Declaring it here as well makes CloudFormation refuse the
  # changeset with AWS::EarlyValidation::ResourceExistenceCheck, because the
  # resource already exists.
  #
  # It stays out of the stack's lifecycle entirely, which also means a stack
  # delete can't fail on a non-empty repository. infra/teardown.sh removes it
  # explicitly, emptying it first.

  # --- Security groups -----------------------------------------------------
  # Three groups, chained: internet -> ALB -> task -> database. Each tier admits
  # only the tier above it, so there is no path from 0.0.0.0/0 to the task or
  # the database (§2.6.1, §7).
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ALB - public HTTP ingress"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP to the load balancer only

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ECS task - reachable only from the ALB"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: App port, ALB security group only - never the open internet

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} RDS - reachable only from the ECS task"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: Postgres, ECS task security group only

  # --- Database ------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} db subnets"
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      # §2.6.2: smallest class that runs, single-AZ, no read replica. This is a
      # teaching deployment and RDS bills continuously while it exists.
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: "17.5"
      AllocatedStorage: "20"
      MasterUsername: postgres
      MasterUserPassword: !Ref DBPassword
      DBName: agent
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 0        # no snapshots to clean up at teardown
      DeletionProtection: false       # teardown must not need a console click
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup

  # --- Load balancer -------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      # ip, not instance: Fargate tasks have no EC2 instance to register (§7).
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        # Default is 300s; a teaching stack that is redeployed repeatedly should
        # not spend five minutes draining a task nobody is talking to.
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- Compute -------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: 7

  ExecutionRole:
    # Used by the ECS agent to pull the image and write logs - not by the app.
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    # The application's own identity. The agent itself calls no AWS APIs; the
    # only permissions here are the SSM channel ECS Exec needs, which is how the
    # pgvector index gets seeded (RDS is unreachable from outside the VPC).
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecs-exec-ssm-channel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-task"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: agent
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: RETRIEVAL_BACKEND
              Value: pgvector          # §2.6.2: the deployed agent uses RDS
            - Name: DATABASE_URL
              Value: !Sub "postgresql://postgres:${DBPassword}@${Database.Endpoint.Address}:5432/agent"
            - Name: LLM_PROVIDER
              Value: !Ref LLMProvider
            - Name: ZAI_API_KEY
              Value: !Ref ZaiApiKey
            - Name: GROQ_API_KEY
              Value: !Ref GroqApiKey
            - Name: ANTHROPIC_API_KEY
              Value: !Ref AnthropicApiKey
            - Name: OPENAI_API_KEY
              Value: !Ref OpenAIApiKey
            - Name: PYTHONWARNINGS
              Value: ignore::UserWarning
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: agent
          # ponytail: keys as task-definition env vars, not Secrets Manager.
          # Correct for a mock-data teaching stack torn down the same day; a real
          # deployment puts them in Secrets Manager and references them with
          # `Secrets:` + `ValueFrom`, which is a one-block change here.

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener   # a service can't register targets before the listener
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      # Required to seed the pgvector index after deploy. RDS is deliberately
      # not publicly accessible, so the index has to be built from inside the
      # task — there is no network route to the database from anywhere else.
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public IP so the task can reach the LLM API and pull from ECR without
          # a NAT gateway (which would cost more than the rest of this stack).
          # Inbound is still ALB-only via TaskSecurityGroup.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: agent
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200

  # --- Autoscaling (§2.6.3) ------------------------------------------------
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-cpu-target-tracking"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent
        # Scale out fast, in slowly: a demo needs the task count to visibly rise
        # within the recording, and flapping back down mid-clip helps nobody.
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

Outputs:
  AlbUrl:
    Description: Public URL of the agent
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  DBEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DBIdentifier:
    Value: !Ref Database
